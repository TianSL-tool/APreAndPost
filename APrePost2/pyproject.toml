[project]
name = "aprepost2"
version = "0.1.0"
description = "Modular pre- and post-processing tools for geotechnical engineering"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "h5py>=3.10",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aprepost2 = "aprepost2.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aprepost2"]
